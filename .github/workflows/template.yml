# Scaffold this template with the REAL scaffolder, then build and run what it produced.
#
# WHY THIS FILE EXISTS
# --------------------
# Nothing ever built this template. That is not a figure of speech: between 2019 and 2026 no
# workflow, script or test in any repository of this project configured it. The result was a
# repository that looked maintained and was two major versions out of date — it pinned qb as a
# submodule at a commit from before v2.0.0, and it still "built", against that pin. Green meant
# nothing, because green was measuring a fossil.
#
# So the property this lane protects is not "the template compiles". It is: a stranger runs the
# published one-liner and gets a tree that configures, builds, tests and RUNS. Anything less
# reproduces the original defect in a new place.
#
# WHAT IT ACTUALLY RUNS
# ---------------------
# qb's own script/qb-new-project.sh, from the qb checkout below, pointed at THIS checkout with
# QB_TEMPLATE_DIR. Not a reimplementation of it, and not the copy published on the default
# branch: the scaffolder and the template are two halves of one product, and a change to either
# can break the pair. Running the real script against the proposed content is the only
# arrangement in which a pull request to either side is tested.
#
# WHICH qb
# --------
# The branch of the same name. qb, the qbm modules, the superproject and this template all carry
# `main` (released) and `develop` (next version) and move together, so a PR against develop is
# tested against qb's develop. The ref is PROVEN to exist before checkout rather than silently
# falling back — a lane that quietly tested a different pairing while reporting green would be
# worse than no lane.
#
# ANTI-VACUITY
# ------------
# Every count below can be satisfied by a build that did nothing, so each is asserted against a
# floor and against its own preconditions: the render must substitute placeholders and leave none
# behind, the build must compile a non-zero number of translation units, the suite must EXECUTE
# (not skip — ctest counts a skip as a pass), and the binary must serve a real HTTP request with
# the expected body. The body, not the status code: a 200 with the wrong payload is exactly what
# a status check cannot see.
name: template

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      qb_ref:
        description: 'isndev/qb ref to build against (empty = the branch of the same name)'
        required: false
        default: ''
  # The template can rot without anyone pushing to it, because qb moves underneath. Weekly is
  # what turns "nobody noticed for seven years" into "nobody noticed for a week".
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-and-build:
    name: scaffold + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Check out this template
        uses: actions/checkout@v6
        with:
          path: template

      # github.base_ref for a PR (the branch being merged INTO), github.ref_name otherwise.
      # Never github.head_ref: on a fork PR that string is attacker-controlled, and it is also
      # the wrong question — what must be tested is the pairing this change would become part of.
      # Passed through env: rather than interpolated into the script, so a branch name can never
      # be shell.
      - name: Resolve which isndev/qb to scaffold with
        env:
          INPUT_REF: ${{ inputs.qb_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF}"
          if [ -z "${ref}" ]; then
            if [ -n "${BASE_REF}" ]; then ref="${BASE_REF}"; else ref="${REF_NAME}"; fi
          fi
          # This template's default branch is `master` while qb's released line is `main`; map it
          # rather than failing, and say so. Everything else is expected to match by name.
          if [ "${ref}" = "master" ]; then ref="main"; fi
          echo "qb ref: ${ref}"
          if ! git ls-remote --exit-code --heads --tags https://github.com/isndev/qb "${ref}" >/dev/null; then
            echo "::error::isndev/qb has no branch or tag '${ref}'. qb and this template carry the same branch names; re-run manually with the qb_ref input for a different pairing."
            exit 1
          fi
          echo "QB_REF=${ref}" >> "${GITHUB_ENV}"

      - name: Check out isndev/qb
        uses: actions/checkout@v6
        with:
          repository: isndev/qb
          ref: ${{ env.QB_REF }}
          path: qb

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3

      # THE RUN THAT MATTERS: the published scaffolder, against this checkout's content.
      - name: Scaffold a project with qb's own qb-new-project.sh
        env:
          QB_TEMPLATE_DIR: ${{ github.workspace }}/template
        run: |
          set -euo pipefail
          # A real user's git has an identity; the runner image does not, and without one the
          # scaffolder cannot make its initial commit — which is a thing this lane asserts below.
          git config --global user.name  'template ci'
          git config --global user.email 'template-ci@example.invalid'

          work="${RUNNER_TEMP}/scaffolded"
          rm -rf "${work}"; mkdir -p "${work}"; cd "${work}"
          QB_REF="${QB_REF}" bash "${GITHUB_WORKSPACE}/qb/script/qb-new-project.sh" DemoApp
          echo "SCAFFOLD_DIR=${work}/DemoApp" >> "${GITHUB_ENV}"

      # The scaffolder's own guarantees, asserted from outside it. Each of these was a shipped
      # defect at some point: an empty tree reported as success, a tree still carrying the
      # template's name, and a tree carrying the template's git history as the user's own.
      - name: What the scaffolder produced is a personalised, fresh repository
        run: |
          set -euo pipefail
          cd "${SCAFFOLD_DIR}"
          fail=0

          files="$(git ls-files | wc -l | tr -d '[:space:]')"
          echo "tracked files: ${files}"
          [ "${files}" -ge 8 ] || { echo "::error::only ${files} tracked files, floor is 8"; fail=1; }

          # Exactly one commit, and no remote: a NEW repository, not the template's history.
          commits="$(git rev-list --count HEAD)"
          echo "commits: ${commits}"
          [ "${commits}" -eq 1 ] || { echo "::error::${commits} commits; expected exactly 1"; fail=1; }
          [ -z "$(git remote)" ] || { echo "::error::a remote survived: $(git remote)"; fail=1; }

          # No placeholder may survive rendering, in content or in a path.
          if grep -rIl '@QB_[A-Z_]*@' . --exclude-dir=.git 2>/dev/null | grep -q .; then
            echo "::error::unresolved placeholders remain:"
            grep -rIl '@QB_[A-Z_]*@' . --exclude-dir=.git | sed 's/^/  /'
            fail=1
          fi
          if find . -path ./.git -prune -o -name '*@QB_*@*' -print | grep -q .; then
            echo "::error::unresolved placeholders in path names"; fail=1
          fi

          # And the tree must actually say the user's name, not the template's.
          grep -q 'project(DemoApp' CMakeLists.txt || {
            echo "::error::CMakeLists.txt does not name the project DemoApp"; fail=1; }

          # THE TEMPLATE'S NAME IN A BUILD-SIGNIFICANT POSITION, which is not the same as the
          # template's name anywhere. A provenance line -- "generated from isndev/qb-sample-project
          # (develop)" -- is legitimate and wanted: it is exactly the breadcrumb whose absence let
          # the old template's staleness go unnoticed for years. What must never appear is the
          # template's name where the BUILD reads it. So comment lines and Markdown are ignored,
          # and the identifier forms are pinned explicitly rather than left to the broad scan.
          #
          # Written this way after the broad version fired on that provenance comment: a check
          # that forces you to delete useful output to make it pass is measuring the wrong thing.
          leaked="$(grep -rIn 'qb-sample-project' . \
                      --exclude-dir=.git --exclude='*.md' \
                    | grep -vE '^[^:]*:[0-9]+:[[:space:]]*#' || true)"
          if [ -n "${leaked}" ]; then
            echo "::error::the template's name appears outside a comment:"
            printf '%s\n' "${leaked}" | sed 's/^/  /'
            fail=1
          fi
          if grep -rInE '(project|add_executable|add_library|add_custom_target)\(qb-sample-project' \
                 . --exclude-dir=.git | grep -q .; then
            echo "::error::a CMake target is named after the template"; fail=1
          fi
          exit "${fail}"

      # FETCHCONTENT_SOURCE_DIR_QB does two jobs here: it keeps the lane honest about which qb is
      # under test (the checkout above, not whatever the generated ref resolves to today), and it
      # exercises the redirect the generated README tells users to use for source-level work.
      - name: Configure the generated project against the qb under test
        run: |
          set -euo pipefail
          cd "${SCAFFOLD_DIR}"
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DDEMOAPP_BUILD_TESTS=ON \
                -DFETCHCONTENT_SOURCE_DIR_QB="${GITHUB_WORKSPACE}/qb" \
                2>&1 | tee "${RUNNER_TEMP}/configure.log"
          # Prove the redirect took effect rather than assuming it: if CMake ignored it, this lane
          # would silently be testing a downloaded qb and the pairing under test would be fiction.
          grep -q "FETCHCONTENT_SOURCE_DIR_QB:.*${GITHUB_WORKSPACE}/qb" build/CMakeCache.txt || {
            echo "::error::the qb source redirect did not reach the cache"; exit 1; }

      - name: Build
        run: |
          set -euo pipefail
          cd "${SCAFFOLD_DIR}"
          cmake --build build --parallel 2>&1 | tee "${RUNNER_TEMP}/build.log"

      - name: Translation units compiled must be non-zero
        run: |
          set -euo pipefail
          tus="$(grep -c 'Building CXX object' "${RUNNER_TEMP}/build.log" || true)"
          echo "translation units compiled: ${tus}"
          [ "${tus}" -gt 0 ] || { echo "::error::0 TUs compiled; every check below would be vacuous"; exit 1; }

      - name: The binary exists and runs
        run: |
          set -euo pipefail
          cd "${SCAFFOLD_DIR}"
          test -x build/bin/DemoApp || { echo "::error::build/bin/DemoApp was not produced"; exit 1; }
          out="$(./build/bin/DemoApp --version)"
          echo "${out}"
          case "${out}" in
            "DemoApp "*) ;;
            *) echo "::error::--version printed '${out}'"; exit 1 ;;
          esac

      - name: Test — executed, not skipped
        run: |
          set -euo pipefail
          cd "${SCAFFOLD_DIR}"
          ctest --test-dir build --output-on-failure --output-junit "${RUNNER_TEMP}/results.xml"
          python3 - "${RUNNER_TEMP}/results.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          skipped = [c.get('name') for c in cases if c.find('skipped') is not None]
          failed  = [c.get('name') for c in cases if c.find('failure') is not None]
          executed = len(cases) - len(skipped)
          print(f"registered={len(cases)} executed={executed} skipped={len(skipped)} failed={len(failed)}")
          for n in skipped: print(f"  SKIPPED: {n}")
          bad = False
          if len(cases) < 2: print(f"::error::{len(cases)} tests registered, floor is 2"); bad = True
          if executed < 2:   print(f"::error::{executed} tests EXECUTED, floor is 2"); bad = True
          if skipped:        print("::error::a test self-skipped; ctest reports that as a pass"); bad = True
          if failed:         print(f"::error::{len(failed)} test(s) failed"); bad = True
          sys.exit(1 if bad else 0)
          PY

      # The end of the sentence "a stranger gets a tree that RUNS".
      - name: The scaffolded server answers over HTTP
        run: |
          set -euo pipefail
          cd "${SCAFFOLD_DIR}"
          ./build/bin/DemoApp --port 18080 &
          server=$!
          trap 'kill "${server}" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if curl -fsS --max-time 1 "http://127.0.0.1:18080/health" >/dev/null 2>&1; then break; fi
            sleep 0.2
          done

          health="$(curl -fsS --max-time 5 "http://127.0.0.1:18080/health")"
          greet="$(curl -fsS --max-time 5 "http://127.0.0.1:18080/?name=ada")"
          echo "GET /health    -> ${health}"
          echo "GET /?name=ada -> ${greet}"

          echo "${health}" | grep -q '"service":"DemoApp"' || {
            echo "::error::/health did not identify itself as DemoApp"; exit 1; }
          echo "${greet}"  | grep -q '"message":"hello, ada"' || {
            echo "::error::/ did not greet the caller"; exit 1; }
          echo "ok: the scaffolded project served both routes"
